<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AvtoUnvan — AI Ekspert</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 16px; background: #f5f7fa; color: #111; }
    .chat-box { max-width: 680px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .messages { min-height: 220px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .msg { padding: 10px 14px; border-radius: 10px; line-height: 1.45; }
    .user { background: #e8f0fe; align-self: flex-end; }
    .ai { background: #f1f3f4; align-self: flex-start; }
    .composer { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #0b57d0; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat-box">
    <h2>AvtoUnvan AI Ekspert</h2>
    <div id="messages" class="messages">
      <div class="msg ai">Salam! AvtoUnvan AI Ekspert buradadir. Avtomobil secimi, qiymet, texniki veziyyet ve ya satis uzre sualinizi yazin.</div>
    </div>
    <form id="chatForm" class="composer">
      <input id="qInput" type="text" placeholder="Sualinizi yazin..." autocomplete="off" />
      <button type="submit">Gonder</button>
    </form>
  </div>
  <script src="./avtounvan-ai-expert.js"></script>
  <script src="./avtounvan-ai-override.js"></script>
  <script>
    (function () {
      const form = document.getElementById("chatForm");
      const input = document.getElementById("qInput");
      const list = document.getElementById("messages");

      function appendMsg(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        list.appendChild(div);
        list.scrollTop = list.scrollHeight;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const q = (input.value || "").trim();
        if (!q) return;
        appendMsg("user", q);
        input.value = "";
        let reply = "";
        if (typeof window.askAiExpert === "function") {
          try {
            reply = await window.askAiExpert(q);
          } catch (_) {}
        }
        if (!reply || typeof reply !== "string") {
          reply = `"${q}" uzre sualiniz qebul olundu. Marka, model, il ve budceni yazsaniz daha deqiq komek ede bilerem.`;
        }
        appendMsg("ai", reply);
      });
    })();
  </script>
</body>
</html>
