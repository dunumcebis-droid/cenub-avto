name: Build hosting ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check generated SEO
        run: node tools/generate-seo.cjs --check
      - name: Build public hosting ZIP
        run: python3 tools/build-hosting-zip.py --output "$RUNNER_TEMP/AvtoUnvan-yeni.zip"
      - name: Publish the public hosting ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view avtounvan-compact-20261120 >/dev/null 2>&1; then
            gh release upload avtounvan-compact-20261120 "$RUNNER_TEMP/AvtoUnvan-yeni.zip" --clobber
          else
            gh release create avtounvan-compact-20261120 "$RUNNER_TEMP/AvtoUnvan-yeni.zip" \
              --target "$GITHUB_SHA" --title "AvtoUnvan — yığcam başlıq və ziyarətçi sayğacı" \
              --notes "AvtoUnvan üçün 77 ictimai fayl. ZIP-i avtounvan.vip domeninin public_html qovluğuna açın."
          fi
