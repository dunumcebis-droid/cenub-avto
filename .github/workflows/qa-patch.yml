name: Publish reviewed QA patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check generated SEO
        run: node tools/generate-seo.cjs --check
      - name: Build index-only patch
        run: python3 tools/build-hosting-zip.py --index-only --output "$RUNNER_TEMP/AvtoUnvan-QA.zip"
      - name: Publish the public patch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view avtounvan-qa-20261120 >/dev/null 2>&1; then
            gh release upload avtounvan-qa-20261120 "$RUNNER_TEMP/AvtoUnvan-QA.zip" --clobber
          else
            gh release create avtounvan-qa-20261120 "$RUNNER_TEMP/AvtoUnvan-QA.zip" \
              --target "$GITHUB_SHA" --title "AvtoUnvan — QA düzəlişləri" \
              --notes "Yalnız index.html düzəlişi. Əvvəldən yüklənmiş 77 fayllıq AvtoUnvan saytının public_html qovluğuna açın və üzərinə yazın."
          fi
